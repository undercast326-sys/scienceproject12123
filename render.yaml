databases:
  - name: science-quiz-db
    plan: free
    databaseName: science_quiz
    user: science_quiz

services:
  - name: science-quiz-backend
    type: web
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && python manage.py ensure_superuser && python manage.py seed_if_empty && (python manage.py import_content content/math.json || echo 'Content import failed, starting with the existing data') && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --preload --timeout 60"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "science-quiz-backend-nq25.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://science-quiz-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: science-quiz-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true

  - name: science-quiz-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: "sed -i \"s|__API_BASE_URL__|$API_BASE_URL|g\" js/config.js"
    staticPublishPath: .
    envVars:
      - key: API_BASE_URL
        value: "https://science-quiz-backend-nq25.onrender.com/api"
